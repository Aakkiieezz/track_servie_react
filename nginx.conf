server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # React frontend
    # ============================================================
    # Serve files from the React production build.
    #
    # If a requested file does not exist, fall back to index.html
    # so React Router can handle client-side routes such as:
    #   /login
    #   /profile
    #   /servies/123
    # ============================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # Backend proxy
    # ============================================================
    # ^~ is important!
    # It prevents the regex static-asset location below from
    # intercepting backend resources such as:
    #
    #   /api/profilePics/UserId-1.jpg
    #   /api/posterImgs/...
    #   /api/users/...
    #
    # These are forwarded to Spring Boot instead.
    location ^~ /api/ {
        proxy_pass http://backend:8080/track-servie/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # Spring Boot OAuth2 callback
    # ============================================================
    # Google redirects the browser back to Spring Security using:
    #
    #   /track-servie/login/oauth2/code/google
    #
    # This URL does NOT start with /api/, so it needs its own
    # proxy rule. Without this block, the request would fall through
    # to the React location above and Nginx would return index.html
    # instead of forwarding the OAuth callback to Spring Boot.
    #
    # Example:
    #   Google:
    #     http://localhost/track-servie/login/oauth2/code/google
    #
    #   Nginx:
    #     http://backend:8080/track-servie/login/oauth2/code/google
    # ============================================================
    location /track-servie/ {
        proxy_pass http://backend:8080/track-servie/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # Static asset caching
    # ============================================================
    # Cache React's generated JS/CSS/images/fonts aggressively.
    # Vite generates hashed filenames for production assets, so
    # immutable caching is safe for those generated files.
    # ============================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}